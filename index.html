<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEDAREV.COM</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            user-select: none;
        }

        #main-text {
            font-size: 8vw;
            line-height: 0.9;
            text-transform: uppercase;
        }

        #status {
            font-size: 4vw;
            color: #ff0000;
            margin-top: 20px;
        }

        #phone {
            font-size: 2vw;
            margin-top: 30px;
            letter-spacing: 5px;
            opacity: 0.7;
        }

        /* Скрытая панель пароля */
        #password-zone {
            display: none;
            flex-direction: column;
        }

        input {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-size: 2rem;
            padding: 10px;
            text-align: center;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div id="main-text">BEDAREV.COM</div>
        <div id="status">ЗАНЯТО ХАХАХАХА</div>
        <div id="phone">+353 87 372 0687</div> </div>

    <div id="password-zone">
        <p>ВВЕДИТЕ ПАРОЛЬ</p>
        <input type="password" id="passInput" autofocus>
    </div>

    <script>
        // Секретное слово
        const secretCode = 'bedarev';
        let inputSequence = '';

        // Мультиязычность
        const userLang = navigator.language || navigator.userLanguage;
        if (!userLang.includes('ru')) {
            document.getElementById('status').innerText = 'OCCUPIED HAHAHAHA';
        }

        // Слушаем нажатия клавиш
        document.addEventListener('keydown', (e) => {
            // Добавляем нажатую букву в строку (в нижнем регистре)
            inputSequence += e.key.toLowerCase();

            // Ограничиваем длину строки, чтобы не жрала память
            if (inputSequence.length > secretCode.length) {
                inputSequence = inputSequence.substring(inputSequence.length - secretCode.length);
            }

            // Проверяем совпадение
            if (inputSequence === secretCode) {
                activateAdminMode();
            }
        });

        function activateAdminMode() {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('password-zone').style.display = 'flex';
            document.getElementById('passInput').focus();
        }

        // Проверка пароля (для примера)
        document.getElementById('passInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (e.target.value === '1234') { // Твой будущий пароль
                    alert('Доступ разрешен. Перенаправляю...');
                    // window.location.href = 'private.html';
                } else {
                    alert('Неверно!');
                    location.reload(); // Перезагрузка при ошибке
                }
            }
        });
    </script>
</body>
</html>
