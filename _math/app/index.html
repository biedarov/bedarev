.ev-l{font-family:var(--fd);font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.ev-b{font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-t{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ev-topic .ev-ic{color:var(--c5)}
.ev-boss{border-color:#ff2a3d44;background:linear-gradient(90deg,#ff2a3d18,var(--panel2))}
.ev-reveal{border-color:var(--accent3)}
.ev-gold{border-color:#e0a10077;background:linear-gradient(90deg,#ffcf4d26,var(--panel2))}
.ev-red{border-color:#ff2a3d99;background:linear-gradient(90deg,#ff2a3d30,var(--panel2))}
.ev-rank{border-color:var(--accent3)}
.ev-ach .ev-ic{color:var(--c2)}
.hsess{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hsess .chip{font-size:.7rem;color:var(--muted)}

/* ---------- countdown ---------- */
.doom{position:relative;border-radius:22px;padding:30px;color:#e9e9ee;overflow:hidden;isolation:isolate;background:radial-gradient(120% 80% at 50% -10%,#3a0008 0%,#0a0002 45%,#050505 80%);border:1px solid #ff2a3d33;box-shadow:0 30px 90px -40px #ff2a3d}
.doom::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.doom .eyebrow{color:#ff5a68;justify-content:center}
.doom-head{text-align:center;padding:6px 0 22px}
.doom-title{display:inline-block;font-family:var(--fd);font-weight:800;font-size:clamp(1.6rem,4.6vw,3rem);letter-spacing:-.04em;margin-top:10px;animation:flick 6s infinite}
.doom-clock{font-family:var(--fd);font-weight:700;font-size:clamp(2rem,8vw,5.4rem);letter-spacing:-.04em;line-height:1;margin:14px 0 10px;color:#fff;text-shadow:0 0 40px #ff2a3d88;font-variant-numeric:tabular-nums}
.doom-clock small{font-size:.38em;color:#ff5a68;margin:0 .12em;font-weight:500}
.doom-sub{color:#9a9aa8;font-size:.85rem}
.dy{max-width:720px;margin:22px auto 0}
.dy-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.dy-bar i{display:block;height:100%;background:linear-gradient(90deg,#ff7a59,#ff2a3d);box-shadow:0 0 18px #ff2a3d;transform-origin:left}
.enter .dy-bar i{animation:grow 1.6s var(--ease) both}
.dy-l{display:flex;justify-content:space-between;gap:10px;font-size:.72rem;color:#8a8a96;margin-top:6px}
.dy-l b{color:#fff;font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:8px}
@media (max-width:900px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:380px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.dcell{padding:16px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.dl{font-family:var(--fd);font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:#8a8a96}
.db{font-family:var(--fd);font-weight:700;font-size:2.5rem;letter-spacing:-.05em;line-height:1.05;margin:8px 0 6px;color:#fff}
.db small{font-size:.4em;color:#6c6c7a;font-weight:400;letter-spacing:0}
.ds{font-size:.76rem;color:#a6a6b2;line-height:1.4}
.dcell.red{border-color:#ff2a3d55;background:linear-gradient(160deg,#ff2a3d1f,rgba(255,255,255,.02))}
.dcell.red .db{color:#ff2a3d;text-shadow:0 0 30px #ff2a3d88}
.dcell.ok .db{color:#4dffa0}
.dverdict{margin:16px 0;padding:18px 20px;border-radius:16px;border:1px solid #ff2a3d55;background:#ff2a3d12;font-family:var(--fd);font-weight:500;font-size:clamp(.95rem,2vw,1.15rem);line-height:1.5;color:#fff}
.dcal,.dweeks{margin-top:12px;padding:16px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.dc-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:.76rem;color:#8a8a96}
.dc-h b{font-family:var(--fd);font-weight:600;color:#fff;font-size:.9rem}
.dc-h i{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 4px 0 10px;vertical-align:middle}
.dc-row{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;margin:3px 0}
.dc-row>span{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:#6c6c7a;font-family:var(--fd)}
.dc-cells{display:grid;grid-template-columns:repeat(31,1fr);gap:3px}
.dc-cells i{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.06)}
.doom i.ok{background:#1fa463} .doom i.x{background:#ff2a3d;opacity:.85} .doom i.f{background:rgba(255,255,255,.08)} .doom i.pre{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)} .doom .dc-cells i.na{background:transparent}
.doom i.now{outline:2px solid #fff;outline-offset:1px;animation:pulseO 1.4s infinite}
.dw{position:relative;display:flex;align-items:flex-end;gap:3px;height:120px}
.dw i{flex:1;background:#ff2a3d;opacity:.75;border-radius:3px 3px 1px 1px;min-width:3px;transform-origin:bottom}
.doom .dw i.ok{background:#1fa463;opacity:1}
.enter .dw i{animation:growY .9s var(--ease) both}
.doom .dw i.fu{height:100%;background:rgba(255,255,255,.035);opacity:1}
.dw-need{position:absolute;left:0;right:0;border-top:1px dashed #fff;opacity:.55}
.dcta{text-align:center;margin-top:26px}
.dq{font-family:var(--fd);font-weight:600;font-size:clamp(1rem,2.6vw,1.45rem);letter-spacing:-.02em;margin-bottom:14px;color:#fff}

/* ---------- path cards: tiers ---------- */
.boss-svg.hidden-boss{color:#5a5a66}
/* hidden: plain grey, follows the light/dark theme, no hue at all */
.cc.unknown{background:var(--panel);color:var(--text);border-color:var(--border);box-shadow:var(--shadow)}
.cc.unknown:hover{border-color:color-mix(in srgb,var(--text) 20%,var(--border));box-shadow:var(--shadow)}
.cc.unknown .cc-bg{width:200px;height:200px;margin-top:-100px;right:-46px;opacity:.28}
.cc.unknown:hover .cc-bg{opacity:.45}
.cc.unknown .hidden-boss{color:var(--muted)}
.cc.unknown .cc-num{-webkit-text-stroke:1px color-mix(in srgb,var(--text) 28%,transparent)}
.cc.unknown .cc-stat>span{color:var(--muted)}
.cc.unknown .cc-stat b{color:var(--text)}
.cc.unknown .cc-line{background:var(--panel2)}
.cc.unknown .cc-line.hp i{background:color-mix(in srgb,var(--text) 14%,transparent)}
.cc.unknown .cc-bn{color:var(--muted)}
/* revealed: the boss itself, in colour, on the right */
.cc.s-none:not(.unknown) .cc-bg{width:176px;height:176px;margin-top:-88px;right:-12px;opacity:.95;-webkit-mask-image:radial-gradient(circle,#000 58%,transparent 74%);mask-image:radial-gradient(circle,#000 58%,transparent 74%)}
.cc.s-none:not(.unknown):hover .cc-bg{transform:scale(1.07)}
/* beaten: the boss sleeps behind the whole card */
.cc.s-boss .cc-bg,.cc.s-gold .cc-bg,.cc.s-red .cc-bg{width:330px;height:330px;margin-top:-165px;right:-96px}
.cc.s-boss .cc-bg{opacity:.3;filter:none}
.cc.s-boss .boss-svg .b-slash,.cc-bg .b-slash{display:none}
.cc.s-boss{border-color:hsl(var(--bh) 50% 40% / .35)}

/* ---------- lore ---------- */
.lorebox{background:radial-gradient(circle at 50% 40%,#17150f,#040403 72%)}
.lore-in{position:relative;max-width:620px;width:calc(100% - 40px);animation:ruPop .8s var(--ease) both}
.lore-cap{font-family:var(--fd);font-size:.64rem;letter-spacing:.32em;text-transform:uppercase;color:#b9a77a;margin-bottom:16px;text-align:center}
.lore-paper{position:relative;padding:30px 32px;border-radius:4px;background:linear-gradient(180deg,#ebe3cb,#d6c9a6);color:#2a2418;font-family:"Courier New",ui-monospace,monospace;font-size:.96rem;line-height:1.65;text-align:left;
  box-shadow:0 40px 90px -24px #000,inset 0 0 70px rgba(120,90,40,.35);transform:rotate(-.7deg)}
.lore-paper::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 25px,rgba(80,60,30,.1) 25px 26px);border-radius:inherit}
.lore-paper p{position:relative;margin:0;opacity:0;animation:inkIn .7s ease forwards;white-space:pre-wrap}
@keyframes inkIn{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
.lore-foot{margin-top:16px;text-align:center;font-size:.72rem;color:#8a8270;letter-spacing:.08em}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.note{padding:18px 20px;border-radius:4px;background:linear-gradient(180deg,#ebe3cb,#d6c9a6);color:#2a2418;font-family:"Courier New",ui-monospace,monospace;font-size:.86rem;line-height:1.55;box-shadow:0 14px 34px -18px rgba(0,0,0,.6)}
.note:nth-child(odd){transform:rotate(-.5deg)} .note:nth-child(even){transform:rotate(.4deg)}
.note-h{display:flex;justify-content:space-between;font-family:var(--fd);font-size:.66rem;letter-spacing:.14em;margin-bottom:10px;color:#6b5a36}
.note p{margin:0;white-space:pre-wrap}
.note.missing{background:var(--panel2);color:var(--muted);box-shadow:none;border:1px dashed var(--border);transform:none}
.note.missing .note-h{color:var(--muted)}
.note.missing p{opacity:.35;letter-spacing:-.05em}
/* quiet log of what a finished session brought */
.sessev{border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:10px 0}
.sessev-h{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 2px}
.sessev .ev{padding:6px 0}
/* while a question is open nothing in the header moves */
body.focus #top *,body.focus #top *::before,body.focus #top *::after{animation-play-state:paused!important}
/* ---------- lore button / archive ---------- */
.lorebtn .muted{font-size:.8em}
.lore-next{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.lore-next.ready{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.nlocked{margin-top:18px}.nl-tiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.nl{width:40px;height:48px;display:grid;place-items:center;border-radius:4px;border:1px dashed var(--border);background:var(--panel2);color:var(--muted);font-family:var(--fd);font-size:.74rem}
.nl.next{border-style:solid;border-color:color-mix(in srgb,var(--accent) 60%,transparent);color:var(--text)}
/* ---------- final boss: the Examiner ---------- */
.ex-svg{display:block;overflow:visible}
.ex-svg .f-r1,.ex-svg .f-r2,.ex-svg .f-ticks,.ex-svg .f-sig,.ex-svg .f-sec,.ex-svg .f-seal,.ex-svg .f-wings,.ex-svg .f-robe,.ex-svg .f-halo,.ex-svg .f-eye{transform-box:view-box;transform-origin:200px 200px}
.ex-svg .f-r1{animation:rkspin 140s linear infinite}
.ex-svg .f-r2{animation:rkspinr 70s linear infinite}
.ex-svg .f-ticks{animation:rkspinr 240s linear infinite}
.ex-svg .f-sig{animation:rkspin 180s linear infinite}
.ex-svg .f-sec{animation:rkspin 60s steps(60) infinite}
.ex-svg .f-wings{animation:fwing 7s ease-in-out infinite}
.ex-svg .f-robe{animation:fwing 9s ease-in-out infinite reverse}
.ex-svg .f-halo{animation:halo 3.2s ease-in-out infinite}
.ex-svg .f-eye{animation:feye 9s infinite}
.ex-svg .f-ember{animation:fember 6s linear infinite}
.ex-svg .f-seal{animation:rkspin 300s linear infinite}
.ex-svg.sealed .f-r1,.ex-svg.sealed .f-ticks,.ex-svg.sealed .f-sig,.ex-svg.sealed .f-wings,.ex-svg.sealed .f-robe{animation-play-state:paused}
.ex-svg.locked *{animation:none!important}
.fbar .ex-svg *,.fres .ex-svg *,.ev-art .ex-svg *{animation:none!important}
@keyframes fwing{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes feye{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.06)}}
@keyframes fember{0%{transform:translateY(0);opacity:0}15%{opacity:.95}100%{transform:translateY(-320px);opacity:0}}

.fcard{position:relative;display:flex;align-items:center;min-height:420px;padding:34px 38px;border-radius:24px;overflow:hidden;isolation:isolate;text-decoration:none;color:#f3eef0;
  background:radial-gradient(70% 95% at 74% 50%,#5c0010 0%,#1c0005 46%,#060002 82%);border:1px solid #ff2a3d88;
  box-shadow:0 0 0 1px #ff2a3d33,0 0 90px -24px #ff2a3d,0 40px 80px -40px #000;transition:transform .4s var(--ease),box-shadow .4s}
.fcard:hover{transform:translateY(-3px);box-shadow:0 0 0 1px #ff2a3d77,0 0 130px -20px #ff2a3d,0 40px 80px -40px #000}
.fcard::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px),linear-gradient(90deg,rgba(6,0,2,.82) 0,rgba(6,0,2,.5) 34%,transparent 58%)}
.fcard::after{content:"";position:absolute;right:6%;top:50%;width:560px;height:560px;margin-top:-280px;z-index:-3;border-radius:50%;background:radial-gradient(circle,#ff2a3d55,transparent 64%);animation:pulseO 3s ease-in-out infinite;will-change:opacity;pointer-events:none}
.fc-art{position:absolute;right:-10px;top:50%;transform:translateY(-50%);z-index:-2;pointer-events:none}
.fc-art .ex-svg{width:min(520px,86vw);height:auto}
.fc-scan{position:absolute;left:0;right:0;top:-140px;height:140px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,transparent,#ff2a3d1f,transparent);animation:fscan 7s linear infinite;will-change:transform}
@keyframes fscan{to{transform:translateY(720px)}}
.fc-in{position:relative;max-width:520px}
.fc-cap{font-family:var(--fd);font-size:.66rem;letter-spacing:.42em;text-transform:uppercase;color:#ff8a95}
.fc-name{position:relative;overflow-wrap:anywhere;font-family:var(--fd);font-weight:800;font-size:clamp(2.2rem,6vw,4.4rem);letter-spacing:-.05em;line-height:.95;margin:12px 0 12px;color:#fff;text-shadow:0 0 44px #ff2a3d,0 0 2px #fff}
.fc-name::before,.fc-name::after{content:attr(data-text);position:absolute;left:0;top:0;opacity:0;pointer-events:none}
.fcard.awake .fc-name::before{color:#ff2a3d;animation:glA 4s infinite;clip-path:inset(0 0 55% 0)}
.fcard.awake .fc-name::after{color:#4df;animation:glB 4s infinite;clip-path:inset(55% 0 0 0)}
.fc-sub{color:#dcb9be;font-size:.95rem;max-width:440px}
.fstats{display:flex;gap:28px;margin-top:20px}
.fstats b{display:block;font-family:var(--fd);font-weight:700;font-size:1.9rem;letter-spacing:-.04em;color:#fff;line-height:1}
.fstats span{display:block;margin-top:4px;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:#c99aa1}
.fchip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#d9c6c9;font-family:var(--fd)}
.fchip b{font-variant-numeric:tabular-nums;color:#fff;letter-spacing:0;font-size:.82rem}
.final-btn{font-size:.95rem;padding:.75rem 1.4rem;animation:fbtn 2.4s ease-in-out infinite}
@keyframes fbtn{50%{box-shadow:0 0 44px -4px #ff2a3d,0 0 0 1px #ffffff55}}
.fcard.sealed{background:radial-gradient(70% 95% at 74% 50%,#4a3300 0%,#1a1200 46%,#070500 82%);border-color:#d9a514;color:#fff6dc;box-shadow:0 0 0 1px #ffcf4d33,0 0 90px -28px #e0a100,0 40px 80px -40px #000}
.fcard.sealed:hover{box-shadow:0 0 0 1px #ffcf4d66,0 0 120px -24px #e0a100,0 40px 80px -40px #000}
.fcard.sealed::before{background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px),linear-gradient(90deg,rgba(7,5,0,.82) 0,rgba(7,5,0,.5) 34%,transparent 58%)}
.fcard.sealed::after{background:radial-gradient(circle,#ffcf4d3a,transparent 64%);animation-duration:5s}
.fcard.sealed .fc-cap{color:#ffd65a}
.fcard.sealed .fc-name{text-shadow:none;background:linear-gradient(90deg,#fff3c4,#ffcf4d 40%,#fff3c4 60%,#d49300);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 6s linear infinite}
.fcard.sealed .fc-sub,.fcard.sealed .fstats span{color:#e8c66a}
.fcard.locked{min-height:250px;background:var(--panel);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow)}
.fcard.locked:hover{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--text) 20%,var(--border))}
.fcard.locked::before,.fcard.locked::after{display:none}
.fcard.locked .fc-art{right:-30px;opacity:.3}
.fcard.locked .fc-art .ex-svg{width:300px}
.fcard.locked .fc-cap,.fcard.locked .fc-sub{color:var(--muted)}
.fcard.locked .fc-name{color:var(--muted);text-shadow:none}
.fc-prog{margin-top:18px;max-width:320px}
.fc-prog span{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--fd);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fc-prog b{color:var(--text);letter-spacing:0;font-size:.78rem;font-weight:500}
.fcard.locked .cc-line{background:var(--panel2)}
.fcard.locked .cc-line i{background:linear-gradient(90deg,#ff2a3d,#ff7a59)}
@media (max-width:760px){
  .fcard{min-height:520px;align-items:flex-end;padding:24px 22px}
  .fc-art{right:50%;top:36%;transform:translate(50%,-50%);opacity:.75}
  .fc-art .ex-svg{width:min(420px,92vw)}
  .fcard.locked{min-height:300px}
  .fstats{gap:18px}
}
.fbar,.fres{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 10px;border-radius:16px;margin-bottom:12px;color:#e9e9ee;background:radial-gradient(120% 140% at 0% 50%,#4a000d,#08080b 60%);border:1px solid #ff2a3d66}
.fres{padding:16px;gap:18px;margin:10px 0}
.fres.sealed{background:radial-gradient(120% 140% at 0% 50%,#4a3300,#0b0800 60%);border-color:#d9a514}
.fsegs{display:flex;gap:4px;margin-top:6px}
.fsegs i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1)}
.fsegs i.hit{background:linear-gradient(90deg,#ffcf4d,#fff3c4);box-shadow:0 0 8px #ffcf4d88}
.fsegs i.miss{background:#ff2a3d66}
.fchs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:6px}
.fchs-b{margin-top:12px}
.fch{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:10px;background:var(--panel2);text-decoration:none;color:var(--muted);font-size:.64rem}
.fch b{font-family:var(--fd);font-size:.95rem;color:var(--text)}
.fch.ok{background:#ff2a3d1f;color:#ff8a95}
.fch.ok b{color:#ff2a3d}
.frules{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:12px}
.frules li{display:flex;gap:14px;align-items:baseline}
.frules b{font-family:var(--fd);font-weight:700;font-size:1.1rem;min-width:56px;color:var(--text)}
.frules span{color:var(--muted);font-size:.86rem}
.fdays{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:8px}
.fdays i{aspect-ratio:1;border-radius:4px;background:var(--panel2)}
.fdays i.ok{background:linear-gradient(135deg,#fff1b8,#e0a100);box-shadow:0 0 8px #e0a10066}
.fdays i.now{outline:1.5px solid #ff2a3d;outline-offset:-1.5px}
.fok{color:#e0a100;font-weight:600}
.gold-btn{background:linear-gradient(135deg,#fff1b8,#e0a100);color:#3b2800;border-color:#ffd65a;box-shadow:0 10px 30px -10px #e0a100;font-family:var(--fd);letter-spacing:.06em}
.fnotice{text-decoration:none;color:inherit;border-color:#ff2a3d66!important;background:linear-gradient(90deg,#ff2a3d1a,transparent)!important}
/* the big moments: the finale opens, the seal holds */
.finalup{--g:#ff2a3d;background:radial-gradient(circle at 50% 42%,#5c0010,#120003 55%,#000 86%)}
.finalup.sealed{--g:#ffcf4d;background:radial-gradient(circle at 50% 42%,#4a3300,#110c00 55%,#000 86%)}
.fu-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:fflash 1.2s ease-out both}
@keyframes fflash{0%{opacity:0}7%{opacity:.92}100%{opacity:0}}
.fu-bars::before,.fu-bars::after{content:"";position:fixed;left:0;right:0;height:9vh;background:#000;z-index:2;animation:fbars 1s var(--ease) both}
.fu-bars::before{top:0;transform-origin:top}
.fu-bars::after{bottom:0;transform-origin:bottom}
@keyframes fbars{from{transform:scaleY(0)}}
.finalup .ru-in{z-index:3;animation-delay:.2s}
.finalup .ru-cap{color:#ff8a95;letter-spacing:.6em;margin-bottom:44px}
.finalup.sealed .ru-cap{color:#ffd65a}
.fu-art{animation:fshake .42s linear .35s 3}
.fu-art .ex-svg{width:min(370px,66vw);height:auto}
@keyframes fshake{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,4px)}}
.fu-name{position:relative;font-family:var(--fd);font-weight:800;font-size:clamp(2.4rem,9vw,6rem);letter-spacing:-.05em;line-height:.95;color:#fff;text-shadow:0 0 54px #ff2a3d,0 0 4px #fff;margin-top:34px}
.fu-name::before,.fu-name::after{content:attr(data-text);position:absolute;left:0;right:0;top:0;opacity:0;pointer-events:none}
.finalup.open .fu-name::before{color:#ff2a3d;animation:glA 2.6s infinite;clip-path:inset(0 0 55% 0)}
.finalup.open .fu-name::after{color:#4df;animation:glB 2.6s infinite;clip-path:inset(55% 0 0 0)}
.finalup.sealed .fu-name{text-shadow:0 0 54px #e0a100,0 0 4px #fff}
/* topics: studied (green) and completed fully (gold) */
.tbar-t i.f{background:linear-gradient(90deg,#d49300,#ffcf4d);box-shadow:0 0 12px #e0a10077}
.enter .tbar-t i.f{animation:grow 1.2s var(--ease) both}
.tfull-n{color:#c98a00;font-weight:600}
:root[data-theme="dark"] .tfull-n{color:#ffcf4d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tfull-n{color:#ffcf4d}}
.tchip.full{color:#b07800;border-color:#e0a10088;background:#ffcf4d1f}
:root[data-theme="dark"] .tchip.full{color:#ffcf4d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tchip.full{color:#ffcf4d}}
.bubble.full{background:linear-gradient(135deg,#fff1b8,#e0a100);border-color:#e0a100;color:#3b2800;font-size:1.2rem;box-shadow:0 0 20px -2px #e0a100aa}
.nbody.tfull{border-color:#e0a10066;box-shadow:0 0 0 1px #e0a10022,var(--shadow)}
.cc-line.tl{display:flex}
.cc-line.tl i{height:100%;transform-origin:left}
.cc-line.tl i.f{background:linear-gradient(90deg,#d49300,#ffcf4d)}
.cc-line.tl i.d{background:linear-gradient(90deg,var(--c5),#8ff0c0)}
.cc-line.tl i.p{background:rgba(255,255,255,.14)}
.cc-stat b em{font-style:normal;color:#ffcf4d}
.chrow-bars .tbar-t{height:6px}
/* a topic is two steps: 1 textbook, 2 its exam questions (solved in this topic's context) */
.exstep{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;flex:none;font-family:var(--fd);font-weight:700;font-size:.74rem;background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
.tstep{display:flex;align-items:center;gap:9px;margin:9px 0 2px}
.tstep b{font-size:.84rem}
.tstep.ok .exstep{background:linear-gradient(135deg,#9df5c9,var(--c5));border-color:var(--c5);color:#fff}
.tstep.none{margin-top:12px;opacity:.75}
.exblock{margin-top:14px;padding:12px 14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--c2) 45%,var(--border));background:linear-gradient(135deg,color-mix(in srgb,var(--c2) 8%,transparent),transparent 70%)}
.exblock>.row{flex-wrap:nowrap;align-items:center;gap:10px}
.exblock .exstep{border-color:var(--c2);color:var(--c2);background:color-mix(in srgb,var(--c2) 10%,var(--panel))}
.exlabel{font-size:.86rem}
.exsegs{display:flex;gap:3px;margin:11px 0 9px}
.exsegs i{flex:1;height:6px;border-radius:3px;background:var(--panel2)}
.exsegs i.hit{background:linear-gradient(90deg,#d49300,#ffcf4d);box-shadow:0 0 8px #e0a10066}
.exsegs i.tried{background:color-mix(in srgb,var(--c2) 70%,transparent)}
.exsegs i.else{background:transparent;box-shadow:inset 0 0 0 1.5px var(--else)}
.exblock.done{border-color:#e0a100;background:linear-gradient(135deg,#ffcf4d24,#e0a10008 70%);box-shadow:0 0 0 1px #e0a10030,0 14px 34px -22px #e0a100}
.exblock.done .exstep{background:linear-gradient(135deg,#fff1b8,#e0a100);border-color:#e0a100;color:#3b2800;font-size:.9rem}
.exdone{flex:none;font-family:var(--fd);font-size:.62rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:6px 11px;border-radius:99px;color:#b07800;background:#ffcf4d24;border:1px solid #e0a10066}
:root[data-theme="dark"] .exdone{color:#ffcf4d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .exdone{color:#ffcf4d}}
/* solved, but in another topic / chapter: a light outline, no credit here */
.pill{position:relative}
:root{--else:#9b72ff}
.pill.else{background:transparent;color:var(--text);border:1.5px dashed var(--else)}
.pill.qall::after{content:"";position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:#ffcf4d;box-shadow:0 0 6px #ffcf4d}
.hp-bar i.else{background:transparent;box-shadow:inset 0 0 0 1.5px #b79bff}
.else-key{display:inline-block;width:14px;height:9px;border-radius:3px;border:1.5px dashed var(--else);vertical-align:-1px;margin-right:2px}
/* account (closed beta) */
.acct{gap:10px;padding:8px 10px 8px 8px;border-radius:14px;border:1px solid var(--border);background:var(--panel)}
.acct-av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,hsl(228 88% 68% / .4),hsl(270 80% 60% / .35));font-family:var(--fd);font-weight:700;font-size:.8rem;color:var(--text)}
</style>
</head>
