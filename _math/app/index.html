  --danger:#e5383b;
  --c1:#e5484d;--c2:#f2883a;--c3:#e9c13b;--c4:#8bc34a;--c5:#1fa463;--cnew:#d7d7d1;--cdue:var(--accent);
  --shadow:0 1px 0 rgba(13,13,16,.03),0 14px 34px -22px rgba(13,13,16,.28);
  --radius:16px;
  --fd:"Unbounded","Onest",system-ui,sans-serif;
  --fb:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08080a;--panel:#111114;--panel2:#18181c;--text:#ededf0;--muted:#8d8d97;--border:#24242a;--line:rgba(255,255,255,.045);
    --al:var(--al-d);--on-accent:#07070a;--cnew:#2c2c33;
    --shadow:0 1px 0 rgba(255,255,255,.025),0 18px 44px -24px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#08080a;--panel:#111114;--panel2:#18181c;--text:#ededf0;--muted:#8d8d97;--border:#24242a;--line:rgba(255,255,255,.045);
  --al:var(--al-d);--on-accent:#07070a;--cnew:#2c2c33;
  --shadow:0 1px 0 rgba(255,255,255,.025),0 18px 44px -24px rgba(0,0,0,.9);
}
/* accent palettes: hue, saturation, lightness for light / dark */
[data-accent="blue"]{--ah:228;--as:88%;--al-l:54%;--al-d:68%}
[data-accent="indigo"]{--ah:248;--as:80%;--al-l:60%;--al-d:74%}
[data-accent="violet"]{--ah:268;--as:78%;--al-l:58%;--al-d:74%}
[data-accent="pink"]{--ah:330;--as:82%;--al-l:54%;--al-d:70%}
[data-accent="red"]{--ah:357;--as:80%;--al-l:52%;--al-d:64%}
[data-accent="orange"]{--ah:22;--as:92%;--al-l:50%;--al-d:60%}
[data-accent="amber"]{--ah:40;--as:96%;--al-l:43%;--al-d:56%}
[data-accent="lime"]{--ah:84;--as:70%;--al-l:38%;--al-d:56%}
[data-accent="green"]{--ah:145;--as:64%;--al-l:36%;--al-d:52%}
[data-accent="teal"]{--ah:172;--as:74%;--al-l:34%;--al-d:50%}
[data-accent="cyan"]{--ah:192;--as:84%;--al-l:40%;--al-d:58%}
[data-accent="mono"]{--ah:0;--as:0%;--al-l:11%;--al-d:93%}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;color:var(--text);font:15px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
body{background:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 95% 75% at 50% 0%,#000 25%,transparent 85%);mask-image:radial-gradient(ellipse 95% 75% at 50% 0%,#000 25%,transparent 85%);
  animation:drift 80s linear infinite}
[data-bg="dots"] body::before{background-image:radial-gradient(color-mix(in srgb,var(--text) 14%,transparent) 1.1px,transparent 1.4px);background-size:22px 22px}
[data-bg="plain"] body::before{display:none}
body::after{content:"";position:fixed;z-index:-1;pointer-events:none;width:70vw;height:70vw;right:-25vw;top:-38vw;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 13%,transparent),transparent 62%);animation:float 22s ease-in-out infinite alternate}
@keyframes drift{to{background-position:56px 56px,56px 56px}}
@keyframes float{to{transform:translate(-8vw,10vw) scale(1.12)}}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{margin:0 0 .5rem;line-height:1.2;font-weight:600}
h1{font-family:var(--fd);font-weight:700;letter-spacing:-.03em;font-size:1.7rem}
h2{font-family:var(--fd);font-weight:500;letter-spacing:-.015em;font-size:1rem}
h3{font-size:.95rem}
::selection{background:var(--accent3)}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.mono{font-family:var(--fd);font-weight:500;letter-spacing:-.02em}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.hidden{display:none!important}
.eyebrow{font-family:var(--fd);font-size:.64rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:16px;height:1px;background:currentColor;opacity:.7}

/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--border)}
#top .in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:9px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:7px;margin-right:16px;text-decoration:none;color:var(--text);font-family:var(--fd);letter-spacing:-.03em;cursor:pointer;user-select:none}
.brand .wm{font-weight:800;font-size:1.08rem}
.brand .wm2{font-weight:300;font-size:1.08rem;color:var(--muted)}
.brand .spark{width:8px;height:8px;align-self:center;background:var(--accent);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:twk 4s var(--ease) infinite}
@keyframes twk{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(90deg) scale(.7)}}
#nav{display:flex;gap:2px;flex-wrap:wrap}
.tab{position:relative;border:0;background:none;padding:8px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.88rem;transition:color .2s,background .2s}
.tab:hover{color:var(--text);background:color-mix(in srgb,var(--text) 5%,transparent)}
.tab.on{color:var(--text)}
.tab::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;border-radius:2px;background:var(--accent);transform:scaleX(0);transition:transform .4s var(--ease)}
.tab.on::after{transform:scaleX(1)}
.badge{display:inline-block;min-width:1.4em;padding:0 .4em;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:.7rem;text-align:center;line-height:1.55em;margin-left:.35em;font-weight:700}
.topright{margin-left:auto;display:flex;align-items:center;gap:8px}
.ttop{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);font-size:.75rem;padding:5px 9px;border-radius:10px;border:1px solid var(--border);background:var(--panel)}
.ttop b{font-family:var(--fd);font-weight:600;color:var(--text);font-size:.78rem}
.ttop .tbar-t{width:62px;height:6px}
.rchip{display:flex;align-items:center;gap:6px;padding:2px 11px 2px 3px;border-radius:99px;border:1px solid var(--border);background:var(--panel);text-decoration:none;color:var(--text);font-weight:600;font-size:.78rem;white-space:nowrap}
.rchip:hover,.ttop:hover{border-color:var(--accent3)}
.lang{display:flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:6px 9px;cursor:pointer;font-family:var(--fd);font-size:.66rem;letter-spacing:.06em}
.lang b{font-weight:500;color:var(--muted)} .lang b.on{color:var(--text);font-weight:700}
.lang i{width:1px;height:10px;background:var(--border)}
main{max-width:1400px;margin:0 auto;padding:20px}
.foot{max-width:1400px;margin:10px auto 26px;padding:0 20px;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.7rem;font-family:var(--fd);letter-spacing:.14em;text-transform:uppercase}
.foot::before,.foot::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
/* phones: logo and controls on one row, the tabs as a single swipeable row under them */
@media (max-width:760px){
  #top .in{padding:8px 14px 0;gap:6px 8px}
  .brand{margin-right:0}
  .topright{order:1;gap:6px}
  #nav{order:2;width:calc(100% + 28px);margin:0 -14px;padding:0 8px 4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 24px),transparent)}
  #nav::-webkit-scrollbar{display:none}
  .tab{flex:none;white-space:nowrap;padding:8px 11px}
  main{padding:14px}
  .foot{padding:0 14px}
}
@media (max-width:760px){.rchip{padding:2px}.rchip>span:not(.embw){display:none}}
@media (max-width:560px){.rcard{gap:12px;padding:14px}.rcard .rname,.rankhero .rname{font-size:1.2rem;overflow-wrap:anywhere}}
@media (max-width:600px){#topTopics{display:none}}

/* ---------- panels ---------- */
.card{position:relative;isolation:isolate;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card::after,.kpi::after,.big::after,.chapcard::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;z-index:-1;
  background:radial-gradient(460px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 8%,transparent),transparent 45%)}
.card:hover::after,.kpi:hover::after,.big:hover::after,.chapcard:hover::after{opacity:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(165px,100%),1fr));gap:12px}
.kpi{position:relative;isolation:isolate;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);overflow:hidden}
.kpi b{display:block;font-family:var(--fd);font-weight:600;font-size:1.4rem;letter-spacing:-.03em;line-height:1.2}
.kpi span{color:var(--muted);font-size:.77rem}
.kpi .ring{position:absolute;right:12px;top:12px;width:34px;height:34px}
.section-title{display:flex;align-items:baseline;gap:12px;margin:28px 0 12px}
.section-title h2{margin:0;font-size:1.08rem}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);align-self:center;min-width:40px}
.idx{font-family:var(--fd);font-size:.66rem;color:var(--accent);letter-spacing:.12em;font-weight:600}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.pagehead h1{margin:6px 0 0}

/* ---------- buttons ---------- */
.btn{position:relative;overflow:hidden;border:1px solid var(--border);background:var(--panel);padding:8px 14px;border-radius:11px;cursor:pointer;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text);transition:border-color .2s,transform .15s var(--ease),background .2s,box-shadow .2s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 8px 22px -12px var(--accent)}
.btn.pri::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-130%);transition:transform .8s var(--ease)}
.btn.pri:hover::before{transform:translateX(130%)}
.btn.pri .badge{background:var(--on-accent);color:var(--accent)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:.82rem;border-radius:8px}
.btn.lg{padding:12px 18px;font-size:.98rem;border-radius:13px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.big-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:12px}
.big{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;text-align:left;padding:18px;border-radius:var(--radius);border:1px solid var(--border);background:var(--panel);cursor:pointer;box-shadow:var(--shadow);overflow:hidden;transition:transform .25s var(--ease),border-color .25s}
.big:hover{border-color:var(--accent3);transform:translateY(-3px)}
.big b{font-size:1rem}
.big .n{font-family:var(--fd);font-size:1.75rem;font-weight:600;color:var(--accent);line-height:1.1;letter-spacing:-.03em}
.big::before{content:"→";position:absolute;right:16px;top:14px;font-size:1.1rem;color:var(--accent);opacity:0;transform:translateX(-8px);transition:all .3s var(--ease)}
.big:hover::before{opacity:1;transform:none}
.big.main{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));border-color:var(--accent);color:var(--on-accent)}
.big.main .n,.big.main .muted,.big.main::before{color:var(--on-accent)}
.big:disabled{opacity:.55;cursor:default;transform:none}

/* ---------- chips / status ---------- */
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.14rem .6rem;border-radius:99px;background:var(--panel2);border:1px solid var(--border);font-size:.78rem;white-space:nowrap;color:var(--text);text-decoration:none}
.chip.on{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
button.chip{cursor:pointer}
.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.dot{display:inline-block;width:.72em;height:.72em;border-radius:50%;background:var(--cnew);flex:none}
.cf1{background:var(--c1)} .cf2{background:var(--c2)} .cf3{background:var(--c3)} .cf4{background:var(--c4)} .cf5{background:var(--c5)}
.st{font-size:.72rem;font-weight:600;padding:.12rem .5rem;border-radius:7px;white-space:nowrap}
.st-new{background:var(--panel2);color:var(--muted)}
.st-due{background:var(--accent2);color:var(--accent)}
.st-sched{background:color-mix(in srgb,var(--c5) 13%,transparent);color:var(--c5)}
.st-retired{background:var(--panel2);color:var(--muted);text-decoration:line-through}
.tchip{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid var(--border);color:var(--muted);white-space:nowrap;letter-spacing:.01em}
.tchip.done{color:var(--c5);border-color:color-mix(in srgb,var(--c5) 45%,transparent);background:color-mix(in srgb,var(--c5) 11%,transparent)}
.tchip.prog{color:var(--accent);border-color:var(--accent3);background:var(--accent2)}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--border);flex:none}
.tdot.prog{border-color:var(--accent);background:var(--accent3)} .tdot.done{border-color:var(--c5);background:var(--c5)}
.kindtag{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:5px;background:var(--panel2);color:var(--muted)}
.kindtag.exam{background:color-mix(in srgb,var(--c2) 16%,transparent);color:var(--c2)}

/* ---------- topic bars ---------- */
.tbar{min-width:0}
.tbar-l{display:flex;align-items:baseline;gap:8px;font-size:.8rem;margin-bottom:7px;flex-wrap:wrap}
.tbar-l>span:first-child{font-weight:600}
.tbar-l b{font-family:var(--fd);font-weight:600;font-size:1rem;letter-spacing:-.02em}
.tbar.tbig .tbar-l b{font-size:1.9rem}
.tbar-t{position:relative;display:flex;height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--border);min-width:40px}
.tbar.tbig .tbar-t{height:14px}
.tbar-t i{display:block;height:100%;transform-origin:left}
.tbar-t i.d{background:linear-gradient(90deg,var(--c5),color-mix(in srgb,var(--c5) 55%,#c9ffe3));box-shadow:0 0 12px color-mix(in srgb,var(--c5) 50%,transparent)}
.tbar-t i.p{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--accent) 45%,transparent) 0 5px,color-mix(in srgb,var(--accent) 22%,transparent) 5px 10px);background-size:200% 100%;animation:stripes 2.5s linear infinite}
@keyframes stripes{to{background-position:-28px 0}}
.hero-books{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:14px;margin-top:14px}
.hero-books .row>div{flex:1}

/* ---------- hero / rank ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(290px,1fr);gap:26px;padding:28px;overflow:hidden}
@media (max-width:960px){.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.hero{padding:20px 18px;gap:18px}}
.hero-h{font-family:var(--fd);font-weight:700;font-size:clamp(1.5rem,3vw,2.35rem);letter-spacing:-.035em;margin:12px 0 22px;line-height:1.08}
.hero-h .muted{font-weight:400;font-size:.55em;letter-spacing:-.01em;display:block;margin-top:8px}
.hero-r{display:flex;align-items:center}
.hero .deco{position:absolute;right:-90px;bottom:-120px;width:420px;color:var(--muted);opacity:.32;pointer-events:none;z-index:-1}
.deco .dk-spin{transform-box:view-box;transform-origin:200px 200px;animation:rkspin 90s linear infinite}
.deco .dk-spinr{transform-box:view-box;transform-origin:200px 200px;animation:rkspinr 140s linear infinite}
.deco .dk-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3.2s var(--ease) .2s forwards}
.deco .dk-t{font-family:var(--fd);font-size:11px;fill:currentColor}
@keyframes draw{to{stroke-dashoffset:0}}
.rcard{position:relative;display:flex;align-items:center;gap:18px;width:100%;padding:18px;border-radius:14px;text-decoration:none;color:var(--text);
  background:linear-gradient(140deg,color-mix(in srgb,var(--g) 16%,var(--panel2)),var(--panel2) 70%);border:1px solid color-mix(in srgb,var(--g) 32%,var(--border));overflow:hidden}
.rcard::before{content:"";position:absolute;inset:-1px;background:linear-gradient(115deg,transparent 35%,color-mix(in srgb,var(--g) 30%,transparent) 50%,transparent 65%);transform:translateX(-100%);animation:sheen 5s var(--ease) infinite;pointer-events:none}
@keyframes sheen{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.rname{font-family:var(--fd);font-weight:700;font-size:1.4rem;letter-spacing:-.03em;color:var(--ink);line-height:1.15;margin:4px 0 2px}
.rcard.t10 .rname,.rcard.t11 .rname,.rcard.t12 .rname,.ru-name.t12,.lstep.t12 b{background:linear-gradient(90deg,#ff3d6e,#ffb340,#ffe14d,#4dff9f,#4dd2ff,#8a5cff,#ff3d6e);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 6s linear infinite}
.rcard.t10 .rname{background-image:linear-gradient(90deg,#ff6a3d,#ffd36e,#ff6a3d)}
.rcard.t11 .rname{background-image:linear-gradient(90deg,#b8860b,#fff3b0,#b8860b)}
@keyframes rainbow{to{background-position:300% 0}}
.rbar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--text) 8%,transparent);overflow:hidden;margin:10px 0 5px}
.rbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c1x,var(--g)),var(--g));box-shadow:0 0 10px var(--g);transform-origin:left}
.rankhero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(220px,1fr);gap:20px;align-items:center}
@media (max-width:860px){.rankhero{grid-template-columns:1fr}}
.rankhero .rname{font-size:2rem}
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:10px}
.lstep{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 10px 14px;border-radius:14px;border:1px solid var(--border);background:var(--panel);overflow:hidden}
.lstep b{font-family:var(--fd);font-weight:600;font-size:.86rem;color:var(--ink)}
.lstep.got{border-color:color-mix(in srgb,var(--g) 35%,var(--border));background:linear-gradient(180deg,color-mix(in srgb,var(--g) 9%,var(--panel)),var(--panel))}
.lstep.cur{box-shadow:0 0 0 2px var(--g),0 14px 40px -18px var(--g)}
.lstep.cur::after{content:"вы здесь";position:absolute;top:8px;right:8px;font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--g);color:#000}
.lstep.lock b{color:var(--muted)}

/* ---------- emblems ---------- */
.embw{display:inline-grid;place-items:center;position:relative;flex:none;isolation:isolate}
.embw .emb{overflow:visible;display:block}
.emb .sp{transform-box:view-box;transform-origin:60px 60px}
.emb .rk-tw{transform-box:fill-box;transform-origin:center;animation:rktw 2.8s ease-in-out infinite}
.rk-spin{animation:rkspin 24s linear infinite}
.rk-spinr{animation:rkspinr 24s linear infinite}
.rk-pulse{animation:rkpulse 3.2s ease-in-out infinite}
.rk-wave{animation:rkwave 3.2s ease-out infinite}
.rk-breathe{transform-box:view-box;transform-origin:60px 60px;animation:rkbreathe 4.5s ease-in-out infinite}
.rk-sweep{animation:rksweep 3.6s ease-in-out infinite}
@keyframes rkspin{to{transform:rotate(360deg)}}
@keyframes rkspinr{to{transform:rotate(-360deg)}}
@keyframes rkpulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes rkwave{0%{transform:scale(.72);opacity:.95}100%{transform:scale(1.55);opacity:0}}
@keyframes rktw{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes rkbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes rksweep{0%{transform:translateX(-60px)}55%,100%{transform:translateX(130px)}}
.embw.t4,.embw.t5,.embw.t6{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--g) 55%,transparent))}
.embw.t7,.embw.t8,.embw.t9{filter:drop-shadow(0 0 9px color-mix(in srgb,var(--g) 70%,transparent))}
.embw.t10{animation:hueglow 9s linear infinite}
.embw.t11{filter:drop-shadow(0 0 12px var(--g));animation:glitch 7s steps(1) infinite}
.embw.t12{animation:hueglow 5s linear infinite}
.embw.t10::before,.embw.t11::before,.embw.t12::before{content:"";position:absolute;inset:-16%;border-radius:50%;z-index:-1;filter:blur(14px);animation:rkspin 6s linear infinite;opacity:.35;
  background:conic-gradient(from 0deg,var(--g),transparent 30%,var(--g) 50%,transparent 80%,var(--g))}
.embw.t12::before{opacity:.6;background:conic-gradient(from 0deg,#ff3d6e,#ffb340,#ffe14d,#4dff9f,#4dd2ff,#8a5cff,#ff3d6e)}
.embw.mini::before{display:none}
.embw.lock{filter:grayscale(1) opacity(.32)!important;animation:none!important}
.embw.lock::before{display:none}
.embw.lock *{animation-play-state:paused!important}
@keyframes hueglow{from{filter:drop-shadow(0 0 10px var(--g)) hue-rotate(0deg)}to{filter:drop-shadow(0 0 10px var(--g)) hue-rotate(360deg)}}
@keyframes glitch{0%,90%,100%{transform:none}91%{transform:translate(1.5px,-1px) skewX(5deg)}93%{transform:translate(-1.5px,1px)}95%{transform:translate(1px,0) skewX(-4deg)}97%{transform:none}}

/* ---------- rank-up overlay & bursts ---------- */
.rankup{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;cursor:pointer;
  background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--g) 35%,#000),rgba(4,4,7,.94) 62%);animation:ruIn .5s var(--ease) both}
.rankup.out{animation:ruOut .4s ease both}
.ru-rays{position:absolute;left:50%;top:44%;width:220vmax;height:220vmax;margin:-110vmax;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--g) 26%,transparent) 0 5deg,transparent 5deg 15deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 32%);mask-image:radial-gradient(circle,#000 0,transparent 32%);animation:rkspin 40s linear infinite}
.ru-sp i{position:absolute;left:50%;top:44%;width:12px;height:12px;margin:-6px;background:var(--g);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:ruSp 1.8s var(--ease) both}
@keyframes ruSp{0%{transform:rotate(var(--a)) translateX(0) scale(0);opacity:1}70%{opacity:1}100%{transform:rotate(var(--a)) translateX(var(--d)) scale(var(--s)) rotate(180deg);opacity:0}}
.ru-in{position:relative;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:12px;animation:ruPop 1s var(--ease) both;padding:20px}
.ru-cap{font-family:var(--fd);letter-spacing:.42em;text-transform:uppercase;font-size:.78rem;opacity:.75}
.ru-name{font-family:var(--fd);font-weight:800;font-size:clamp(2.2rem,7vw,4.6rem);letter-spacing:-.04em;line-height:1;color:var(--ink);text-shadow:0 0 40px var(--g)}
.ru-sub{opacity:.75;font-size:.95rem;max-width:520px}
@keyframes ruIn{from{opacity:0}to{opacity:1}}
@keyframes ruOut{to{opacity:0;transform:scale(1.04)}}
@keyframes ruPop{0%{transform:scale(.4);opacity:0;filter:blur(10px)}60%{transform:scale(1.06);opacity:1;filter:none}100%{transform:scale(1)}}
.burst{position:fixed;z-index:90;pointer-events:none;width:0;height:0}
.burst i{position:absolute;width:11px;height:11px;margin:-5.5px;background:var(--c5);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:pop .85s var(--ease) forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.2) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--r));opacity:0}}

/* ---------- enter animations ---------- */
.enter>*{animation:rise .6s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}
.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(6){animation-delay:.25s}.enter>*:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.enter .bar>i,.enter .tbar-t i,.enter .progress>i,.enter .rbar i{animation:grow 1.2s var(--ease) both}
.enter .tbar-t i.p{animation:grow 1.2s var(--ease) both,stripes 2.5s linear infinite}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.enter .chapcard,.enter .lstep,.enter .ach,.enter .node{animation:rise .6s var(--ease) both}
.enter .chapcard:nth-child(2),.enter .lstep:nth-child(2),.enter .node:nth-child(2){animation-delay:.04s}
.enter .chapcard:nth-child(3),.enter .lstep:nth-child(3),.enter .node:nth-child(3){animation-delay:.08s}
.enter .chapcard:nth-child(4),.enter .lstep:nth-child(4),.enter .node:nth-child(4){animation-delay:.12s}
.enter .chapcard:nth-child(5),.enter .lstep:nth-child(5),.enter .node:nth-child(5){animation-delay:.16s}
.enter .chapcard:nth-child(n+6),.enter .lstep:nth-child(n+6),.enter .node:nth-child(n+6){animation-delay:.2s}
/* reduced motion: every animation jumps straight to its end state, so nothing that fades in stays hidden */
[data-motion="reduced"] *,[data-motion="reduced"] *::before,[data-motion="reduced"] *::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important}
/* plans: a locked image or feature, the plan chip, the account card */
.lockbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 22px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--border));background:var(--panel2);text-align:center;max-width:560px;margin:0 auto;color:var(--text)}
.lockbox .lk{font-size:1.5rem}.lockbox b{font-family:var(--fd);font-weight:600;font-size:.98rem}
img.cimg:not([src]){background:linear-gradient(90deg,#0000000a,#00000014,#0000000a);background-size:200% 100%;animation:stripes 1.4s linear infinite}
img.cerr{outline:1px dashed var(--border)}
.planchip{display:inline-flex;align-items:center;padding:1px 8px;border-radius:99px;font-family:var(--fd);font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--border);color:var(--muted);vertical-align:2px}
.planchip.pro{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.planchip.max{color:#ff5a6a;border-color:#ff2a3d77}
.btn.danger.sm{padding:.35rem .7rem}
html.cloud a[href*=".pdf"]{display:none}
.tab.pro{padding-right:42px}
.tab.pro::before{content:"PRO";position:absolute;right:7px;top:50%;transform:translateY(-50%);padding:2px 4px;border-radius:5px;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent);font-family:var(--fd);font-size:.5rem;font-weight:600;letter-spacing:.06em;line-height:1}
.upchip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 12%,var(--panel));color:var(--text);text-decoration:none;font-weight:600;font-size:.78rem;white-space:nowrap}
.upchip:hover{border-color:var(--accent)}
.propitch{display:flex;flex-direction:column;gap:8px;width:100%;padding:20px;border-radius:14px;text-decoration:none;color:var(--text);background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 16%,var(--panel2)),var(--panel2) 70%);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border))}
.propitch b{font-family:var(--fd);font-weight:600;font-size:1.1rem;letter-spacing:-.02em}
.propitch ul,.prolist{margin:0;padding-left:18px;font-size:.88rem;color:var(--muted);display:grid;gap:4px}
.propitch .btn{align-self:flex-start;margin-top:4px}
.propage{display:grid;gap:16px;justify-items:center}.prolist{max-width:520px}
.kpi.kpilock{text-decoration:none;color:var(--muted);border-style:dashed}.kpi.kpilock b{font-size:1.2rem}
@media (max-width:560px){.tab.pro{padding-right:38px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important}}

/* ---------- bank ---------- */
.bank{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.bank{grid-template-columns:minmax(0,1fr)}}
.filters{position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto}
.ftog{display:none}
@media (max-width:900px){.filters{position:static;max-height:none}.ftog{display:inline-flex}.filters:not(.open)>:not(.row):not(input){display:none}}
.filters h3{margin:16px 0 7px;font-size:.66rem;font-family:var(--fd);font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.filters input[type=search]{width:100%;padding:.55rem .7rem;border:1px solid var(--border);border-radius:10px;background:var(--panel2)}
.tree details{border-radius:8px}
.tree summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.4rem;padding:.28rem .35rem;border-radius:7px}
.tree summary::-webkit-details-marker{display:none}
.tree summary:hover{background:var(--panel2)}
.tree summary .arrow{width:1em;color:var(--muted);transition:transform .2s}
.tree details[open]>summary .arrow{transform:rotate(90deg)}
.tree .book{font-weight:700;margin-top:8px;font-family:var(--fd);font-size:.8rem}
.tree label{display:flex;align-items:center;gap:.4rem;padding:.17rem .35rem .17rem 1.6rem;border-radius:7px;cursor:pointer;font-size:.86rem}
.tree label:hover{background:var(--panel2)}
.tree .cnt{margin-left:auto;color:var(--muted);font-size:.72rem;white-space:nowrap}
.tree .chap{font-weight:600;font-size:.88rem}
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{display:grid;grid-template-columns:160px 1fr auto;gap:12px;align-items:center;padding:11px 15px;background:var(--panel);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:border-color .2s,transform .2s var(--ease)}
.qrow:hover{border-color:var(--accent3);transform:translateX(3px)}
.qrow .id{font-family:var(--fd);font-weight:600;font-size:.86rem;letter-spacing:-.02em}
.qrow .meta{font-size:.76rem;color:var(--muted)}
.qrow .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:.76rem;color:var(--muted)}
@media (max-width:640px){.qrow{grid-template-columns:minmax(0,1fr)}.qrow .right{align-items:flex-start;flex-direction:row;flex-wrap:wrap}.qrow .chip{white-space:normal}}
.starbtn{border:0;background:none;cursor:pointer;font-size:1.1rem;color:var(--muted);padding:0 .2rem;transition:transform .2s var(--ease)}
.starbtn:hover{transform:scale(1.2) rotate(15deg)}
.starbtn.on{color:#f5b301}

/* ---------- practice ---------- */
.sessbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;border:1px solid var(--border);border-radius:14px;background:color-mix(in srgb,var(--panel) 85%,transparent)}
.sessbar>b{font-family:var(--fd);font-weight:500;font-size:.88rem}
.progress{flex:1;min-width:160px;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px;transform-origin:left;box-shadow:0 0 10px var(--accent3)}
.prac{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
@media (max-width:1100px){.prac{grid-template-columns:minmax(0,1fr)}}
.paper{background:#fff;border-radius:12px;border:1px solid var(--border);padding:12px;overflow:auto;box-shadow:var(--shadow)}
.paper img{display:block;margin:0;width:100%;height:auto}
.rate{position:sticky;top:72px}
@media (max-width:1100px){.rate{position:static}}
.confbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.confbtn{border:1.5px solid var(--border);background:var(--panel);border-radius:12px;padding:.55rem .2rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-family:var(--fd);font-size:1rem;transition:transform .2s var(--ease),border-color .2s}
.confbtn:hover{transform:translateY(-2px);border-color:var(--accent3)}
.confbtn small{font-family:var(--fb);font-weight:500;font-size:.64rem;color:var(--muted);text-align:center;line-height:1.15}
.confbtn.on{color:#fff;animation:pick .35s var(--ease)}
@keyframes pick{50%{transform:scale(1.12)}}
.confbtn.on small{color:#fff}
.confbtn[data-v="1"].on{background:var(--c1);border-color:var(--c1)}
.confbtn[data-v="2"].on{background:var(--c2);border-color:var(--c2)}
.confbtn[data-v="3"].on{background:var(--c3);border-color:var(--c3);color:#1b1f27}
.confbtn[data-v="3"].on small{color:#1b1f27}
.confbtn[data-v="4"].on{background:var(--c4);border-color:var(--c4);color:#1b1f27}
.confbtn[data-v="4"].on small{color:#1b1f27}
.confbtn[data-v="5"].on{background:var(--c5);border-color:var(--c5);box-shadow:0 0 22px -4px var(--c5)}
.partrow{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;margin:4px 0}
.minis{display:flex;gap:3px}
.mini{width:26px;height:24px;border-radius:7px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:.75rem;font-weight:700}
.mini.on[data-v="1"]{background:var(--c1);color:#fff;border-color:var(--c1)}
.mini.on[data-v="2"]{background:var(--c2);color:#fff;border-color:var(--c2)}
.mini.on[data-v="3"]{background:var(--c3);border-color:var(--c3)}
.mini.on[data-v="4"]{background:var(--c4);border-color:var(--c4)}
.mini.on[data-v="5"]{background:var(--c5);color:#fff;border-color:var(--c5)}
.ivs{display:flex;flex-wrap:wrap;gap:5px}
.iv{border:1px solid var(--border);background:var(--panel);padding:.3rem .6rem;border-radius:9px;cursor:pointer;font-size:.8rem;position:relative;transition:border-color .2s}
.iv:hover{border-color:var(--accent3)}
.iv.sug{border-color:var(--accent);border-style:dashed}
.iv.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.field{display:flex;flex-direction:column;gap:5px;margin-top:14px}
.field>label{font-size:.64rem;font-family:var(--fd);font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
input.num,select,textarea,input.txt{padding:.45rem .6rem;border:1px solid var(--border);border-radius:9px;background:var(--panel2)}
input.num{width:5.5rem}
textarea{width:100%;min-height:62px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent3);outline-offset:1px;border-color:var(--accent)}
.kbd{display:inline-block;padding:0 .38em;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;font-size:.7rem;font-family:ui-monospace,monospace;background:var(--panel2);color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-family:var(--fd);font-size:.85em}
.hist{font-size:.8rem;display:flex;flex-direction:column;gap:4px}
.tagline{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tagline .chip{white-space:normal}

/* ---------- tables ---------- */
table{border-collapse:collapse;width:100%}
th,td{padding:.5rem .55rem;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:500;font-family:var(--fd);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.chaprow{cursor:pointer;font-weight:600}
tr.chaprow:hover{background:var(--panel2)}
tr.secrow td:first-child{padding-left:1.8rem;font-weight:400}
.rowacts a{margin-left:6px}
td.cellbar{min-width:110px}
.frac{font-size:.78rem;color:var(--muted)} .frac b{color:var(--text)}
.tablewrap{overflow-x:auto}
.bar{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;min-width:60px;box-shadow:inset 0 0 0 1px var(--border)}
.bar>i{display:block;height:100%;background:var(--accent);transform-origin:left;border-radius:99px}
.confcell{display:inline-flex;align-items:center;gap:.35rem;font-variant-numeric:tabular-nums}

/* ---------- exam map ---------- */
.emap{border-collapse:separate;border-spacing:3px;width:auto}
.emap td,.emap th{border:0;padding:0;text-align:center}
.emap th{font-size:.64rem;padding:0 2px}
.cell{width:26px;height:22px;border-radius:6px;background:var(--cnew);cursor:pointer;display:block;font-size:.63rem;line-height:22px;color:rgba(0,0,0,.55);transition:transform .15s}
.cell:hover{transform:scale(1.18)}
.cell.due{outline:2px solid var(--cdue);outline-offset:-2px}
.cell.none{background:none;cursor:default}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;background:rgba(6,6,9,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto;animation:ruIn .25s ease both}
#modal .box{margin:auto 0;background:var(--panel);border-radius:18px;max-width:1000px;width:100%;padding:20px;border:1px solid var(--border);box-shadow:0 30px 80px -30px rgba(0,0,0,.6);animation:rise .35s var(--ease) both}
#modal .box.narrow{max-width:600px}
#modal:not(.hidden){animation:mIn .22s ease both}
#modal.closing{animation:mOut .19s ease both}
#modal.closing .box{animation:sink .19s var(--ease) both}
@keyframes mIn{from{opacity:0}}
@keyframes mOut{to{opacity:0}}
@keyframes sink{to{opacity:0;transform:translateY(14px) scale(.98)}}
/* page changes: the old page fades up and out while the new one rises in */
#main{view-transition-name:page}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-old(page){animation:pageOut .22s var(--ease) both}
::view-transition-new(page){animation:none}
::view-transition-group(page){animation-duration:.22s}
@keyframes pageOut{to{opacity:0;transform:translateY(-12px)}}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);padding:.6rem 1.1rem;border-radius:12px;z-index:60;font-weight:600;opacity:0;transition:all .3s var(--ease);pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
.svgchart{width:100%;height:auto;display:block}
.svgchart text{fill:var(--muted);font-size:11px}
@media (max-width:560px){.svgchart:not(.hm) text{font-size:17px}}
.svgchart.hm text{font-size:7.5px}
.fc-now{display:flex;align-items:baseline;gap:8px;margin:2px 0 10px}.fc-now b{font-family:var(--fd);font-weight:600;font-size:1.5rem;color:var(--c2)}.fc-now span{color:var(--muted);font-size:.8rem}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:.3rem}
.empty{padding:28px;text-align:center;color:var(--muted)}
.notice{padding:11px 15px;border-radius:12px;background:var(--accent2);border:1px solid var(--accent3);margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:11px;overflow:hidden;background:var(--panel);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:.32rem .75rem;cursor:pointer;font-size:.82rem;border-radius:8px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.prio{display:flex;flex-direction:column;gap:7px}
.prio .it{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:10px;align-items:center;padding:8px 10px;border-radius:11px;background:var(--panel2);border:1px solid transparent;transition:border-color .2s}
.prio .it:hover{border-color:var(--accent3)}
.prio{container-type:inline-size}
/* a narrow card: the topic on its own line, the bar and buttons under it */
@container (max-width:440px){.prio .it{grid-template-columns:minmax(0,1fr) auto}.prio .it>:first-child{grid-column:1/-1}}

/* ---------- textbook ---------- */
.xpcard{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.lvl{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.lvl .rname{font-size:1.05rem;margin:0}
.chapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:12px}
.chapcard{position:relative;isolation:isolate;display:block;text-decoration:none;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);transition:border-color .25s,transform .25s var(--ease)}
.chapcard:hover{border-color:var(--accent3);transform:translateY(-3px)}
.chapcard.complete{border-color:color-mix(in srgb,var(--c5) 50%,var(--border));box-shadow:0 0 0 1px color-mix(in srgb,var(--c5) 25%,transparent),var(--shadow)}
.cc-row{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin:9px 0 4px}
.cc-row b{color:var(--text);font-family:var(--fd);font-weight:500;font-size:.74rem}
.chn{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:9px;background:var(--accent2);color:var(--accent);font-weight:700;font-size:.82rem;font-family:var(--fd)}
.chn.lg{min-width:48px;height:48px;font-size:1.2rem;border-radius:14px}
.medals{display:inline-flex;gap:2px}
.medal{font-size:1.1rem;filter:grayscale(1);opacity:.28}
.medal.won{filter:none;opacity:1}
.medal.lg{font-size:2rem}
.stars{color:#f5b301;letter-spacing:1px;white-space:nowrap}
.stars.lg,.bigstars{font-size:1.6rem}
.bigstars{color:#f5b301;letter-spacing:3px;font-size:2.4rem}
.crumbs{margin:2px 0 12px;color:var(--muted);font-size:.86rem}
.crumbs a{color:var(--muted)}
.chaphead{margin-bottom:6px}
.path{position:relative;margin-top:16px}
.path:before{content:"";position:absolute;left:24px;top:10px;bottom:30px;width:2px;background:linear-gradient(var(--accent3),var(--border) 30%,var(--border));border-radius:2px}
.node{display:grid;grid-template-columns:52px 1fr;gap:12px;margin-bottom:12px;position:relative}
.bubble{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--border);font-weight:700;font-size:.74rem;color:var(--muted);z-index:1;font-family:var(--fd)}
.bubble.part{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent2)}
.bubble.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:1.1rem}
.bubble.gold{background:linear-gradient(135deg,#9df5c9,var(--c5));border-color:var(--c5);color:#fff;font-size:1.25rem;box-shadow:0 0 18px -2px color-mix(in srgb,var(--c5) 70%,transparent)}
.bubble.boss{background:linear-gradient(135deg,#ff7a59,#c81d4e);border-color:#c81d4e;font-size:1.3rem}
.nbody{padding:14px 16px}
.nbody.tdone{border-color:color-mix(in srgb,var(--c5) 40%,var(--border))}
.crit{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 2px}
.crit span{font-size:.72rem;padding:2px 8px;border-radius:7px;background:var(--panel2);color:var(--muted)}
.crit span.ok{background:color-mix(in srgb,var(--c5) 12%,transparent);color:var(--c5);font-weight:600}

.exlabel{font-size:.82rem}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.pill{min-width:28px;height:24px;padding:0 6px;border-radius:7px;border:1px solid var(--border);background:var(--panel2);font-size:.7rem;font-weight:700;cursor:pointer;color:var(--muted);transition:transform .15s var(--ease),border-color .15s}
.pill:hover{border-color:var(--accent);transform:translateY(-1px)}
.pill.xp{font-family:var(--fd);font-weight:500;font-size:.64rem;letter-spacing:-.01em}
.pill.cf1{background:var(--c1);color:#fff;border-color:var(--c1)} .pill.cf2{background:var(--c2);color:#fff;border-color:var(--c2)}
.pill.cf3{background:var(--c3);color:#1b1f27;border-color:var(--c3)} .pill.cf4{background:var(--c4);color:#1b1f27;border-color:var(--c4)}
.pill.cf5{background:var(--c5);color:#fff;border-color:var(--c5)}
.pill.due{outline:2px solid var(--cdue);outline-offset:1px}
.pill.ret{opacity:.45}
.boss{border-color:#c81d4e55;background:linear-gradient(180deg,rgba(200,29,78,.06),transparent 40%),var(--panel)}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:10px}
.tier{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--panel)}
.tier.won{border-color:#f5b301}
.challenge{margin-top:12px;border:1px dashed #c81d4e88;border-radius:12px;padding:12px}
.chal-res{display:flex;align-items:center;gap:18px;padding:12px 14px;border-radius:12px;background:var(--panel2);margin:10px 0}
.approx{font-size:.8rem;padding:6px 10px;margin-bottom:8px;border-radius:8px;background:#fff6dd;color:#6b5200;border:1px solid #f0d58a}

/* ---------- sessions + awards ---------- */
.sesscount{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--panel2);margin:10px 0}
.sesscount.off{background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.35)}
.newach{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 8px}
.sesstable td{font-size:.87rem}
tr.offrow td{opacity:.55}
tr.sessdetail td{background:var(--panel2)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:10px}
.ach{display:flex;gap:12px;padding:13px;border-radius:14px;border:1px solid var(--border);background:var(--panel);transition:transform .25s var(--ease),border-color .25s}
.ach:hover{transform:translateY(-2px);border-color:var(--accent3)}
.ach .bar{margin-top:6px}
.achicon{font-size:1.9rem;width:50px;height:50px;display:grid;place-items:center;border-radius:14px;background:var(--panel2);flex:none}
.ach.locked .achicon{filter:grayscale(1);opacity:.4}
.ach.t1 .achicon{background:#f3d9c2}.ach.t2 .achicon{background:#e3e7ee}.ach.t3 .achicon{background:#fbe7a1}
.ach.t4 .achicon{background:#d6f1ef}.ach.t5 .achicon{background:#dbe9ff}.ach.t6 .achicon,.ach.t7 .achicon{background:#f1dbff}
.achtier{font-size:.66rem;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--accent2);color:var(--accent)}
.achsteps{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.achsteps span{font-size:.63rem;padding:0 5px;border-radius:5px;background:var(--panel2);color:var(--muted)}
.achsteps span.on{background:var(--c5);color:#fff}

/* ---------- adaptive study ---------- */
.studybar{border:1px solid var(--accent3);background:linear-gradient(135deg,var(--accent2),var(--panel) 80%);border-radius:14px;padding:11px 14px;margin-bottom:12px}
.studybar.exam{border-color:color-mix(in srgb,var(--c2) 55%,var(--border));background:linear-gradient(135deg,color-mix(in srgb,var(--c2) 12%,var(--panel)),var(--panel) 80%)}
.studytypes{display:flex;gap:3px;margin:8px 0 4px;flex-wrap:wrap}
.st-t{display:inline-block;width:18px;height:7px;border-radius:4px;background:var(--cnew);flex:none}
.st-t.done{background:var(--c5)} .st-t.weak{background:var(--c2)} .st-t.cur{outline:2px solid var(--accent);outline-offset:1px}
.studyres{border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin:10px 0;background:var(--panel2)}
.studyres.ok{border-color:var(--c5)} .studyres.warn{border-color:var(--c2)}
.studylist{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.studychip.ok{background:color-mix(in srgb,var(--c5) 14%,transparent);color:var(--c5);border-color:var(--c5)} .studychip.warn{background:color-mix(in srgb,var(--c2) 14%,transparent);color:var(--c2);border-color:var(--c2)}

/* ---------- worked solutions written by Claude ---------- */
.csol{border:1px solid var(--accent3);border-radius:12px;background:var(--panel);margin-top:12px;overflow:hidden}
.csol-h{padding:9px 13px;background:var(--accent2);font-weight:600;font-size:.88rem}
.csol-b{padding:13px 15px;white-space:pre-wrap;line-height:1.65;font-size:.97rem;font-family:"Cambria Math",Cambria,"Segoe UI",serif;overflow-x:auto}

/* ---------- settings ---------- */
.setrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.setrow>span:first-child{width:120px;font-weight:600;font-size:.88rem}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--border);cursor:pointer;transition:transform .2s var(--ease)}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 2px var(--text);transform:scale(1.08)}
.prevstrip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:12px;border-radius:12px;border:1px dashed var(--border)}

/* ---------- header gear ---------- */
.gear{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;transition:color .2s,border-color .2s}
.gear svg{transition:transform .8s var(--ease)}
.gear:hover,.gear.on{color:var(--text);border-color:var(--accent3)}
.gear:hover svg,.gear.on svg{transform:rotate(120deg)}

/* ---------- path ---------- */
.pathsum{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:6px}
.pathstats,.bosscount{display:flex;gap:10px;flex-wrap:wrap}
.bosscount{margin-top:10px}
.pst{display:flex;flex-direction:column;align-items:center;min-width:92px;padding:10px 12px;border-radius:14px;border:1px solid var(--border);background:var(--panel2)}
.pst>span{font-size:1.25rem;line-height:1}
.pst b{font-family:var(--fd);font-weight:600;font-size:1.25rem;margin-top:4px}
.pst b small{font-size:.7em;color:var(--muted);font-weight:400}
.pst small{font-size:.68rem;color:var(--muted)}
.pst.boss>span{color:var(--c1)} .pst.gold>span{color:#e0a100} .pst.red>span{color:#ff2a3d;text-shadow:0 0 12px #ff2a3d88}
.cc-top{display:flex;align-items:center;gap:10px}
.cc-name{display:block;font-size:.95rem;line-height:1.25}
.cc-sub{color:var(--muted)}
.cc-boss{width:62px;height:62px;border-radius:14px;background:radial-gradient(circle,#15151b,#060608);display:grid;place-items:center;flex:none;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.cc-boss .boss-svg *,.chrow-art .boss-svg *{animation:none!important}
.cc-boss .boss-svg .b-eye,.chrow-art .boss-svg .b-eye{animation:blink 7s infinite!important}
.chapcard:hover .cc-boss .boss-svg .b-body{animation:breathe 2.5s ease-in-out infinite!important}
.hpmini{height:6px;border-radius:99px;background:color-mix(in srgb,var(--c1) 14%,var(--panel2));overflow:hidden}
.hpmini i{display:block;height:100%;background:linear-gradient(90deg,#ff2a3d,#ff7a59);box-shadow:0 0 10px #ff2a3d88;transform-origin:left}
.hpmini.dark{background:rgba(255,255,255,.08)}
.chbadge{display:inline-flex;align-items:center;gap:4px;font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap;font-family:var(--fd)}
.chbadge.boss{background:color-mix(in srgb,var(--c1) 14%,transparent);color:var(--c1);border:1px solid color-mix(in srgb,var(--c1) 40%,transparent)}
.chbadge.gold{background:linear-gradient(90deg,#fff1b8,#ffcf4d,#e0a100,#ffcf4d);background-size:300% 100%;color:#4a3300;animation:rainbow 4s linear infinite;box-shadow:0 0 16px -2px #ffc53188}
.chbadge.red{background:linear-gradient(90deg,#3a0006,#ff2a3d,#7a0010,#ff2a3d);background-size:300% 100%;color:#fff;animation:rainbow 2.6s linear infinite;box-shadow:0 0 22px -2px #ff2a3daa;text-shadow:0 0 6px #fff8}
/* gold / crimson chapters */
.chapcard.s-boss{border-color:color-mix(in srgb,var(--c1) 35%,var(--border))}
.chapcard.s-gold,.chaphead.s-gold{border-color:#e9b622;background:linear-gradient(160deg,color-mix(in srgb,#ffd65a 16%,var(--panel)),var(--panel) 55%);box-shadow:0 0 0 1px #ffcf4d55,0 18px 50px -24px #e0a100}
.chapcard.s-gold::before,.chaphead.s-gold::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:linear-gradient(135deg,#fff3c4,#e0a100 30%,#ffcf4d 55%,#8a6200 80%,#fff3c4);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.chapcard.s-red,.chaphead.s-red{border-color:#ff2a3d;color:#fff;background:radial-gradient(120% 90% at 50% 120%,#5a0010 0%,#1a0004 45%,#0b0003 100%);box-shadow:0 0 0 1px #ff2a3d77,0 0 60px -14px #ff2a3d,0 18px 60px -20px #000}
.chapcard.s-red .cc-sub,.chapcard.s-red .cc-row,.chaphead.s-red .muted,.chaphead.s-red .tiny{color:#ffb3ba!important}
.chapcard.s-red .cc-row b,.chaphead.s-red .tbar-l b{color:#fff}
.chapcard.s-red::before,.chaphead.s-red::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:linear-gradient(135deg,#ff2a3d,#2a0005 30%,#ff7a59 55%,#2a0005 80%,#ff2a3d);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.chaphead.s-red .chtitle{color:#fff;text-shadow:0 0 18px #ff2a3d,0 0 2px #fff;animation:flick 4s infinite}
.chaphead.s-gold .chtitle{background:linear-gradient(90deg,#8a6200,#e0a100,#fff1b8,#e0a100,#8a6200);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 5s linear infinite}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes angle{to{--ang:360deg}}
@keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.7}97%{opacity:1}}
.chfx{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none;z-index:-1;contain:strict}
.chfx i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;animation:ember 4s linear infinite;will-change:transform,opacity}
.chfx::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;will-change:transform;animation:sweep 4.5s var(--ease) infinite}
.s-gold .chfx::after{background:linear-gradient(105deg,transparent,rgba(255,214,90,.22),transparent)}
.s-red .chfx::after{background:linear-gradient(105deg,transparent,rgba(255,42,61,.25),transparent);animation-duration:2.8s}
@keyframes sweep{0%{transform:translateX(0)}60%,100%{transform:translateX(360%)}}
.s-gold .chfx i{background:#ffd65a;box-shadow:0 0 8px #ffcf4d}
.s-red .chfx i{background:#ff4d5e;box-shadow:0 0 10px #ff2a3d;width:3px;height:3px}
@keyframes ember{0%{transform:translateY(0) translateX(0);opacity:0}15%{opacity:1}100%{transform:translateY(-260px) translateX(18px);opacity:0}}
.chtitle{font-size:1.6rem;margin:0}
.tierlbl{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--panel2);font-family:var(--fd);font-weight:700;color:var(--c2)}
.bubble.rev{background:var(--panel2);border-color:var(--c2);color:var(--c2);font-size:1.2rem}
.bubble.bossb{background:#0a0a0d;border-color:#ff2a3d;color:#ff2a3d;font-size:1.2rem;box-shadow:0 0 18px -2px #ff2a3d88}

/* ---------- bosses ---------- */
.boss-svg{display:block;overflow:visible}
.boss-svg .b-ring{transform-box:view-box;transform-origin:120px 120px;animation:rkspin 60s linear infinite}
.boss-svg .b-ring2{transform-box:view-box;transform-origin:120px 120px;animation:rkspinr 40s linear infinite}
.boss-svg .b-halo{animation:halo 4.5s ease-in-out infinite;transform-box:view-box;transform-origin:120px 120px}
.boss-svg .b-body{animation:breathe 5.5s ease-in-out infinite;transform-box:view-box;transform-origin:120px 130px}
.boss-svg .b-eye{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
.boss-svg .b-sway{transform-box:view-box;animation:sway 6s ease-in-out infinite alternate}
.boss-svg .b-spin{transform-box:view-box;transform-origin:120px 120px;animation:rkspin 30s linear infinite}
.boss-svg .b-ember{animation:bember 5s linear infinite}
.boss-svg.dead{filter:grayscale(.85) brightness(.75)}
.boss-svg.dead .b-eye{animation:none;transform:scaleY(.08)}
.boss-svg.dead .b-body,.boss-svg.dead .b-sway,.boss-svg.dead .b-ring,.boss-svg.dead .b-spin{animation-play-state:paused}
.boss-svg.dead .b-slash path{stroke-dasharray:240;stroke-dashoffset:240;animation:slash .9s var(--ease) forwards}
.boss-svg.dead .b-slash path+path{animation-delay:.25s}
.boss-svg.gold{filter:drop-shadow(0 0 10px #ffc53199)}
.boss-svg.red{filter:drop-shadow(0 0 14px #ff2a3dcc);animation:glitch 5s steps(1) infinite}
.boss-svg.red .b-halo{animation-duration:1.8s}
@keyframes halo{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035) translateY(-2px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.05)}}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes bember{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-190px);opacity:0}}
@keyframes slash{to{stroke-dashoffset:0}}
.bosscard{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;padding:26px;border-radius:20px;overflow:hidden;color:#e9e9ee;isolation:isolate;
  background:radial-gradient(90% 120% at 15% 50%,hsl(var(--bh) 70% 14%) 0%,#09090c 55%,#050507 100%);border:1px solid hsl(var(--bh) 60% 30% / .6);box-shadow:0 30px 80px -30px hsl(var(--bh) 80% 30% / .7),inset 0 0 0 1px rgba(255,255,255,.03)}
.bosscard::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:radial-gradient(circle at 20% 50%,#000,transparent 70%);mask-image:radial-gradient(circle at 20% 50%,#000,transparent 70%)}
.bosscard::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
@media (max-width:760px){.bosscard{grid-template-columns:1fr;justify-items:center}}
.boss-cap{font-family:var(--fd);font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;color:hsl(var(--bh) 80% 70%);opacity:.85}
.boss-name{overflow-wrap:anywhere;position:relative;font-family:var(--fd);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.5rem);letter-spacing:-.04em;line-height:1.02;margin:8px 0 6px;color:#fff;text-shadow:0 0 30px hsl(var(--bh) 90% 50% / .6)}
.boss-name::before,.boss-name::after{content:attr(data-text);position:absolute;left:0;top:0;opacity:0;pointer-events:none}
.bosscard.alive .boss-name::before{color:hsl(var(--bh) 100% 60%);animation:glA 5s infinite;clip-path:inset(0 0 55% 0)}
.bosscard.alive .boss-name::after{color:#4df;animation:glB 5s infinite;clip-path:inset(55% 0 0 0)}
@keyframes glA{0%,88%,100%{opacity:0;transform:none}89%{opacity:.8;transform:translate(3px,-1px)}91%{opacity:.8;transform:translate(-2px,0)}93%{opacity:0}}
@keyframes glB{0%,89%,100%{opacity:0;transform:none}90%{opacity:.7;transform:translate(-3px,1px)}92%{opacity:.7;transform:translate(2px,0)}94%{opacity:0}}
.boss-title{font-size:.9rem;color:#a9a9b6;font-style:italic;max-width:520px}
.hp{margin:16px 0 10px}
.hp-l{display:flex;align-items:baseline;gap:6px;font-family:var(--fd);font-size:.7rem;letter-spacing:.14em;color:#ff8a95}
.hp-l b{font-size:1.4rem;color:#fff;letter-spacing:-.02em}
.hp-bar{display:flex;gap:3px;margin-top:6px}
.hp-bar i{flex:1;height:10px;border-radius:3px;background:linear-gradient(180deg,#ff4d5e,#a3001a);box-shadow:0 0 10px #ff2a3d66;transition:all .4s}
.hp-bar i.tried{background:linear-gradient(180deg,#ff9f6b,#a34a1a);box-shadow:0 0 8px #ff7a3a55}
.hp-bar i.hit{background:rgba(255,255,255,.08);box-shadow:none}
.hp-bar.sm i{height:6px}
.boss-req{list-style:none;padding:0;margin:12px 0;display:flex;flex-direction:column;gap:6px;font-size:.84rem;color:#c9c9d3}
.boss-req li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05)}
.boss-req li b{font-family:var(--fd);font-weight:500;font-size:.8rem}
.boss-req li.ok{color:#9ff0c6;border-color:#1fa46355;background:#1fa4631a}
.boss-q .pill{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);color:#bbb}
.boss-q .pill.cf1,.boss-q .pill.cf2,.boss-q .pill.cf5{color:#fff} .boss-q .pill.cf1{background:var(--c1)} .boss-q .pill.cf2{background:var(--c2)} .boss-q .pill.cf3{background:var(--c3);color:#1b1f27} .boss-q .pill.cf4{background:var(--c4);color:#1b1f27} .boss-q .pill.cf5{background:var(--c5)}
.boss-btn{background:linear-gradient(135deg,#ff2a3d,#8a0016);border-color:#ff4d5e;color:#fff;box-shadow:0 10px 30px -10px #ff2a3d;font-family:var(--fd);letter-spacing:.06em}
.boss-btn:hover{box-shadow:0 10px 40px -6px #ff2a3d;border-color:#fff}
.boss-hint{color:#9a9aa8}
.bosscard.dead{border-color:rgba(255,255,255,.08);background:radial-gradient(90% 120% at 15% 50%,#17171b,#09090c 60%)}
.bosscard.dead .boss-name{color:#9a9aa8;text-decoration:line-through;text-decoration-color:#ff2a3d;text-decoration-thickness:3px;text-shadow:none}
.bosscard.gold{background:radial-gradient(90% 120% at 15% 50%,#4a3600 0%,#120d02 55%,#050402 100%);border-color:#e0a100;box-shadow:0 0 0 1px #ffcf4d55,0 30px 80px -30px #e0a100}
.bosscard.gold .boss-name{background:linear-gradient(90deg,#8a6200,#ffcf4d,#fff3c4,#ffcf4d,#8a6200);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 5s linear infinite;text-shadow:none}
.bosscard.gold .boss-cap{color:#ffd65a}
.bosscard.red{background:radial-gradient(90% 130% at 15% 60%,#6a0012 0%,#1c0004 50%,#070001 100%);border-color:#ff2a3d;box-shadow:0 0 0 1px #ff2a3d88,0 0 80px -20px #ff2a3d,0 30px 80px -30px #000}
.bosscard.red .boss-name{color:#fff;text-shadow:0 0 22px #ff2a3d,0 0 2px #fff;animation:flick 3.5s infinite}
.bosscard.red .boss-cap{color:#ff6b78}
.bosscard.red::before{background-image:radial-gradient(#ff2a3d22 1px,transparent 1.5px);background-size:14px 14px;opacity:1}
.bossbar{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 10px;border-radius:16px;margin-bottom:12px;color:#e9e9ee;background:radial-gradient(120% 140% at 0% 50%,hsl(var(--bh) 70% 16%),#08080b 60%);border:1px solid hsl(var(--bh) 60% 30% / .6)}
.bb-name{font-family:var(--fd);font-weight:700;font-size:1.05rem;letter-spacing:-.02em;color:#fff}
.hpnum{font-family:var(--fd);font-weight:700;font-size:1.3rem;color:#fff;white-space:nowrap}
.hpnum span{font-size:.62rem;letter-spacing:.14em;color:#ff8a95}
.hpnum small{font-size:.7em;color:#9a9aa8;font-weight:400}
.minib{position:relative;display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--radius);cursor:pointer;color:#e9e9ee;overflow:hidden;
  background:radial-gradient(100% 120% at 10% 50%,hsl(var(--bh) 70% 15%),#08080b 62%);border:1px solid hsl(var(--bh) 60% 30% / .6);box-shadow:var(--shadow);transition:transform .3s var(--ease)}
.minib:hover{transform:translateY(-3px)}
.minib.dead{background:radial-gradient(100% 120% at 10% 50%,#18181c,#08080b 62%)}
.mb-name{overflow-wrap:anywhere;font-family:var(--fd);font-weight:800;font-size:clamp(1rem,2.2vw,1.35rem);letter-spacing:-.03em;color:#fff;line-height:1.1;margin:4px 0}
.bossres{display:flex;align-items:center;gap:18px;padding:16px;border-radius:16px;margin:10px 0;color:#e9e9ee;background:radial-gradient(120% 140% at 0% 50%,hsl(var(--bh) 70% 16%),#08080b 60%);border:1px solid hsl(var(--bh) 60% 30% / .6)}
.bossup .ru-name{color:#fff}
.bossup.gold .ru-name{background:linear-gradient(90deg,#8a6200,#ffcf4d,#fff3c4,#ffcf4d,#8a6200);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 4s linear infinite;text-shadow:none}
.bossup.red .ru-name{text-shadow:0 0 30px #ff2a3d,0 0 4px #fff;animation:flick 3s infinite}

/* ---------- home ---------- */
.curch h2{font-family:var(--fd)}
.enter .ring .ring-v{animation:ringIn 1.2s var(--ease) both}
@keyframes ringIn{from{stroke-dasharray:0 200}}

/* ---------- statistics ---------- */
.stabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:16px;scrollbar-width:none}
.stabs button{position:relative;border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.88rem;white-space:nowrap}
.stabs button:hover{color:var(--text)}
.stabs button.on{color:var(--text)}
.stabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.split2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:14px}
.sp{overflow:hidden}
.sp-book{border-top:3px solid var(--accent)} .sp-exam{border-top:3px solid var(--c2)}
.sp-h h2{font-size:1.15rem;margin:6px 0 0}
.spbig{display:flex;align-items:center;gap:18px;margin:16px 0}
.spbig .ring{width:92px;height:92px;flex:none}
.spbig b{display:block;font-family:var(--fd);font-weight:700;font-size:2.4rem;letter-spacing:-.04em;line-height:1}
.spbig b small{font-size:.45em;color:var(--muted);font-weight:400;letter-spacing:0}
.spbig div>span{color:var(--muted);font-size:.8rem}
.rcard.compact{gap:12px;padding:14px}.rcard.compact .rname{font-size:1.02rem}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:6px 16px;margin-bottom:14px}
@media (max-width:560px){.kvs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:.82rem}
.kv span{color:var(--muted)} .kv b{font-family:var(--fd);font-weight:500;font-size:.88rem}
.dist{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;margin-top:4px}
.dist i{display:block;height:100%;transform-origin:left}
.dist i.un{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--border)}
.enter .dist i{animation:grow 1s var(--ease) both}
.sprows{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.sprow{display:grid;grid-template-columns:140px 1fr 80px;gap:10px;align-items:center;font-size:.8rem}
.sprow b{text-align:right;font-family:var(--fd);font-weight:500;font-size:.78rem}
.years{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:16px;padding-top:6px}
.yr{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.yr i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--c2),color-mix(in srgb,var(--c2) 40%,transparent));transform-origin:bottom}
.enter .yr i{animation:growY 1s var(--ease) both}
@keyframes growY{from{transform:scaleY(0)}}
.yr span{font-size:.6rem;color:var(--muted);font-family:var(--fd)}
.svgchart .vb{transform-box:fill-box;transform-origin:bottom}
.enter .svgchart .vb{animation:growY .8s var(--ease) both}
.enter .svgchart .ln{stroke-dasharray:1;animation:drawIn 1.4s var(--ease) both}
@keyframes drawIn{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.chrows{display:flex;flex-direction:column;gap:8px}
.chrow{position:relative;display:grid;grid-template-columns:70px minmax(0,1fr) minmax(260px,1.1fr);gap:16px;align-items:center;padding:10px 16px 10px 10px;border-radius:16px;border:1px solid var(--border);background:var(--panel);text-decoration:none;color:var(--text);transition:transform .25s var(--ease),border-color .25s;isolation:isolate;overflow:hidden}
.chrow:hover{transform:translateX(4px);border-color:var(--accent3)}
@media (max-width:860px){.chrow{grid-template-columns:70px 1fr}.chrow-bars{grid-column:1/-1}}
.chrow-art{width:66px;height:66px;border-radius:14px;background:radial-gradient(circle,#15151b,#060608);display:grid;place-items:center;overflow:hidden}
.chrow-bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.chrow-bars>div{display:grid;grid-template-columns:76px 1fr 54px;gap:6px;align-items:center;font-size:.7rem;color:var(--muted)}
.chrow-bars b{text-align:right;color:var(--text);font-family:var(--fd);font-weight:500;font-size:.7rem}
.chrow.s-gold{border-color:#e9b622;background:linear-gradient(90deg,color-mix(in srgb,#ffd65a 14%,var(--panel)),var(--panel) 60%)}
.chrow.s-red{border-color:#ff2a3d;background:linear-gradient(90deg,#3a0008,var(--panel) 70%);box-shadow:0 0 30px -14px #ff2a3d}
.chrow.s-boss{border-color:color-mix(in srgb,var(--c1) 30%,var(--border))}

/* ---------- achievements ---------- */
.achtop{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.achsum{min-width:220px;flex:1}
.achbig{display:block;font-family:var(--fd);font-weight:700;font-size:2.6rem;letter-spacing:-.04em;margin:6px 0 10px;line-height:1}
.achbig small{font-size:.4em;color:var(--muted);font-weight:400}
.achtiers{display:flex;gap:8px;flex-wrap:wrap}
.att{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:68px;padding:10px 8px;border-radius:14px;background:var(--panel2);border:1px solid var(--border)}
.att i{width:22px;height:22px;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:linear-gradient(135deg,var(--b),var(--a))}
.att b{font-family:var(--fd);font-weight:600;font-size:1.05rem}
.att span{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:10px}
.achv{position:relative;display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;border:1px solid var(--border);background:var(--panel);overflow:hidden;transition:transform .25s var(--ease),border-color .25s;isolation:isolate}
.achv:hover{transform:translateY(-2px);border-color:var(--accent3)}
.achv:not(.locked){border-color:color-mix(in srgb,var(--a) 40%,var(--border));background:linear-gradient(120deg,color-mix(in srgb,var(--b) 18%,var(--panel)),var(--panel) 60%)}
.achv.t4 .achb,.achv.t5 .achb{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--a) 60%,transparent))}
.achv.t6 .achb,.achv.t7 .achb{filter:drop-shadow(0 0 10px var(--a))}
.achv.locked{opacity:.8}
.achb{flex:none}
.enter .achb .achring{animation:ringIn 1.4s var(--ease) both}
.achtier{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:linear-gradient(135deg,var(--b,var(--panel2)),var(--a,var(--panel2)));color:#1d1404}
.achnum{display:flex;align-items:baseline;gap:6px;margin-top:6px;font-size:.78rem;color:var(--muted)}
.achnum b{font-family:var(--fd);font-weight:600;font-size:1.05rem;color:var(--text)}
.achnum em{margin-left:auto;font-style:normal;font-family:var(--fd);font-size:.7rem}
.achsteps{display:flex;gap:4px;margin-top:7px}
.achsteps i{flex:1;height:4px;border-radius:2px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--border)}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.rec{padding:10px 12px;border-radius:12px;background:var(--panel2)}
.rec b{display:block;font-family:var(--fd);font-weight:600;font-size:1.15rem;letter-spacing:-.02em}
.rec b small{font-size:.6em;color:var(--muted);font-weight:400}
.rec span{font-size:.7rem;color:var(--muted)}
.recent{display:flex;gap:6px;flex-wrap:wrap}
.lgseg button{padding:.45rem 1rem;font-size:.9rem}
.lgseg small{opacity:.65;font-weight:500;margin-left:4px}

/* ---------- brand logo (mask, so it takes the text colour: white on dark, black on light) ---------- */
.brand{align-items:center}
.brand .logo{display:block;height:21px;aspect-ratio:823/168;background:var(--text);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.tab.doomtab{color:#ff2a3d}
.tab.doomtab::after{background:#ff2a3d}

/* ---------- path: chapter cards ---------- */
.chapgrid{grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:14px}
.cc{position:relative;display:flex;flex-direction:column;justify-content:space-between;height:214px;padding:18px 18px 16px;border-radius:18px;overflow:hidden;isolation:isolate;text-decoration:none;color:#ececf1;
  background:radial-gradient(130% 120% at 100% 30%,hsl(var(--bh) 55% 13%),#0b0b0e 58%,#070709);border:1px solid rgba(255,255,255,.07);box-shadow:0 14px 34px -22px rgba(0,0,0,.7);transition:transform .35s var(--ease),border-color .35s,box-shadow .35s}
.cc:hover{transform:translateY(-4px);border-color:hsl(var(--bh) 70% 55% / .5);box-shadow:0 26px 50px -26px hsl(var(--bh) 80% 40% / .8)}
.cc-bg{position:absolute;right:-70px;top:50%;width:260px;height:260px;margin-top:-130px;z-index:-1;opacity:.5;pointer-events:none;-webkit-mask-image:radial-gradient(circle at 55% 50%,#000 35%,transparent 72%);mask-image:radial-gradient(circle at 55% 50%,#000 35%,transparent 72%);transition:opacity .45s,transform .7s var(--ease);will-change:transform}
.cc:hover .cc-bg{opacity:.85;transform:scale(1.07) translateX(-8px)}
.cc-bg .boss-svg *,.ch-bg .boss-svg *{animation:none!important}
.cc-bg .boss-svg .b-eye,.ch-bg .boss-svg .b-eye{animation:blink 7s infinite!important}
.cc-head{display:flex;align-items:flex-start;justify-content:space-between}
.cc-num{font-family:var(--fd);font-weight:300;font-size:2.4rem;line-height:.9;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.4)}
.cc-tag{font-family:var(--fd);font-size:.58rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.08);color:#fff}
.cc-title{font-family:var(--fd);font-weight:600;font-size:1.02rem;line-height:1.2;letter-spacing:-.02em;max-width:74%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.cc-bn{margin-top:5px;font-size:.72rem;letter-spacing:.06em;color:hsl(var(--bh) 75% 72%)}
.cc.unknown .cc-bn{color:#6c6c7a}
.cc-foot{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cc-stat>span{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--fd);font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.cc-stat b{font-size:.74rem;letter-spacing:0;color:#fff;font-weight:500}
.cc-line{height:3px;border-radius:2px;background:rgba(255,255,255,.09);margin-top:7px;overflow:hidden}
.cc-line i{display:block;height:100%;background:linear-gradient(90deg,var(--c5),#8ff0c0);transform-origin:left}
.cc-line.hp i{background:linear-gradient(90deg,#ff2a3d,#ff7a59)}
.cc.unknown .cc-line.hp i{background:#2a2a33}
.enter .cc{animation:rise .6s var(--ease) both}
.enter .cc:nth-child(2){animation-delay:.04s}.enter .cc:nth-child(3){animation-delay:.08s}.enter .cc:nth-child(4){animation-delay:.12s}.enter .cc:nth-child(n+5){animation-delay:.16s}
.enter .cc-line i{animation:grow 1.2s var(--ease) both}
.cc.s-boss{border-color:rgba(255,255,255,.13)}
.cc.s-boss .cc-bg{opacity:.3;filter:grayscale(1)}
.cc.s-boss .cc-tag{background:rgba(255,42,61,.16);color:#ff8a95}
.cc.s-gold{color:#fff6dc;border-color:#d9a514;background:radial-gradient(120% 120% at 100% 20%,#6a4b00 0%,#2a1d00 38%,#0d0900 75%);box-shadow:0 0 0 1px #ffcf4d44,0 24px 60px -24px #e0a100,inset 0 1px 0 #fff3c455}
.cc.s-gold .cc-bg{opacity:.8}
.cc.s-gold .cc-num{-webkit-text-stroke:1px #ffd65a;text-shadow:0 0 18px #ffcf4d66}
.cc.s-gold .cc-title{background:linear-gradient(90deg,#fff3c4,#ffcf4d 40%,#fff3c4 60%,#d49300);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 5s linear infinite}
.cc.s-gold .cc-tag{background:linear-gradient(135deg,#fff1b8,#e0a100);color:#3b2800}
.cc.s-gold .cc-bn,.cc.s-gold .cc-stat>span{color:#e8c66a}
.cc.s-gold::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 18px,rgba(255,214,90,.05) 18px 19px)}
.cc.s-red{color:#fff;border-color:#ff2a3d;background:radial-gradient(110% 110% at 80% 40%,#7a0014 0%,#2a0007 40%,#0a0002 78%);box-shadow:0 0 0 1px #ff2a3d66,0 0 46px -12px #ff2a3d,0 24px 60px -24px #000}
.cc.s-red .cc-bg{opacity:.95}
.cc.s-red .cc-num{color:#ff2a3d;-webkit-text-stroke:0;text-shadow:0 0 24px #ff2a3d}
.cc.s-red .cc-title{text-shadow:0 0 16px #ff2a3daa;animation:flick 4.5s infinite}
.cc.s-red .cc-tag{background:#ff2a3d;color:#fff;box-shadow:0 0 16px #ff2a3d}
.cc.s-red .cc-bn,.cc.s-red .cc-stat>span{color:#ff9aa4}
.cc.s-red::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 50% at 75% 50%,#ff2a3d55,transparent 70%);animation:pulseO 2.4s ease-in-out infinite;will-change:opacity}
@keyframes pulseO{0%,100%{opacity:.35}50%{opacity:1}}
.chaphead{overflow:hidden}
.ch-bg{position:absolute;right:-40px;top:50%;width:340px;height:340px;margin-top:-170px;z-index:-1;opacity:.13;pointer-events:none;-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 70%);mask-image:radial-gradient(circle,#000 30%,transparent 70%)}
.chaphead.s-gold .ch-bg,.chaphead.s-red .ch-bg{opacity:.45}

/* ---------- hidden things ---------- */
.bosscard.unknown{border-color:rgba(255,255,255,.08);background:radial-gradient(90% 120% at 15% 50%,#15151b,#060608 60%);box-shadow:var(--shadow)}
.bosscard.unknown .boss-name{color:#3a3a46;text-shadow:none;letter-spacing:.2em}
.bosscard.unknown .boss-cap{color:#6c6c7a}
.bosscard.unknown .hp-bar i{background:#1c1c22;box-shadow:none}
.minib.unknown{background:radial-gradient(100% 120% at 10% 50%,#15151b,#060608 62%);border-color:rgba(255,255,255,.08)}
.minib.unknown .mb-name{color:#3a3a46;letter-spacing:.2em}
.minib.unknown .boss-cap{color:#6c6c7a}
.pst.unknown>span,.pst.unknown small{color:var(--muted)}
.lstep.unknown b{color:var(--muted);letter-spacing:.2em}
.embw.unknown{filter:none!important;opacity:1!important}
.achv.secret{opacity:.75;border-style:dashed}
.achv.secret b{letter-spacing:.2em;color:var(--muted)}

/* ---------- history ---------- */
.hsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.hsum>div{padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--border)}
.hsum b{display:block;font-family:var(--fd);font-weight:600;font-size:1.2rem;letter-spacing:-.03em}
.hsum span{font-size:.72rem;color:var(--muted)}
.timeline{position:relative}
.timeline::before{content:"";position:absolute;left:31px;top:0;bottom:0;width:1px;background:linear-gradient(var(--accent),var(--border) 15%,var(--border))}
.hmonth{position:relative;font-family:var(--fd);font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin:22px 0 10px 78px}
.hday{display:grid;grid-template-columns:64px 1fr;gap:14px;margin-bottom:10px;position:relative}
.hdate{display:flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:64px;border-radius:16px;background:var(--panel);border:1px solid var(--border);position:relative;z-index:1}
.hdate b{font-family:var(--fd);font-weight:600;font-size:1.35rem;line-height:1}
.hdate small{font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:4px}
.hday.has-ev .hdate{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent2)}
.hbody{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px 14px;min-width:0}
.hstat{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:.86rem}
.hstat b{font-family:var(--fd);font-weight:600;font-size:1.05rem}
.hstat span{color:var(--muted);font-size:.78rem}
.dist.mini{height:5px;margin-top:8px}
.evs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.ev{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:var(--panel2);border:1px solid transparent}
.ev-ic{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--panel);font-size:.95rem;flex:none}
.ev-art{width:46px;height:46px;border-radius:12px;background:radial-gradient(circle,#15151b,#060608);display:grid;place-items:center;overflow:hidden;flex:none}
.ev-art.rk{background:none}
.ev-art .boss-svg *{animation:none!important}
