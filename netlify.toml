# The maths site is the math folder of this repo: GitHub Pages serves it at bedarev.com/math/,
# and Netlify (math.bedarev.com, if it is switched on again) publishes the same folder.
# Leave "Base directory" empty in the Netlify settings: this file then applies as written.
[build]
  publish = "math"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
